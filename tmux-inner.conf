# Inner tmux (runs inside Neovim terminal)
# Inherit main tmux config then override the prefix
source-file ~/.tmux.conf

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g status-position top
set -g base-index 1
set -g pane-base-index 1

# Dismiss popups without killing the session (mirrors C-Space e/n to open)
bind e detach-client
bind n detach-client
